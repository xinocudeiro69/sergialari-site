<div class="panel" id="test-panel">
<h1 style="margin-top:0">Test gratuito de higiene dental</h1>
<p>Responde en <strong>menos de 1 minuto</strong>. Verás tu resultado y recomendaciones al final.</p>
<div class="card" id="step-box"></div>
<div id="nav-box" style="margin-top:12px;display:flex;gap:8px">
<button class="btn secondary" disabled="" id="btn-back" onclick="testBack()">Atrás</button>
<button class="btn" id="btn-next" onclick="testNext()">Siguiente</button>
</div>
<div class="card" id="resultado" style="display:none;margin-top:14px"></div>
</div>
</div>
</section>
</div>
<script>
var steps=[
 {q:"¿Te cepillas los dientes al menos 2 veces al día?", name:"cepillados"},
 {q:"¿Usas hilo dental o irrigador al menos 4 días por semana?", name:"interprox"},
 {q:"¿Cepillas o limpias la lengua de forma habitual?", name:"lengua"},
 {q:"¿Evitas dulces/bebidas azucaradas entre horas con frecuencia?", name:"azucar", invert:true},
 {q:"¿Tu cepillo/cabezal tiene menos de 3 meses de uso?", name:"recambio"},
 {q:"¿Revisión o limpieza profesional en el último año?", name:"revision"}
];
var idx=0; var answers={};
function render(){
  var s=steps[idx];
  var html='<p><strong>'+(idx+1)+'.</strong> '+s.q+'</p>';
  html+='<label><input type="radio" name="ans" value="si"> Sí</label>';
  html+='<label style="margin-left:14px"><input type="radio" name="ans" value="no"> No</label>';
  document.getElementById('step-box').innerHTML=html;
  document.getElementById('btn-back').disabled=(idx===0);
  document.getElementById('btn-next').textContent=(idx===steps.length-1)?'Ver resultado':'Siguiente';
  if(answers[s.name]){
    var sel=document.querySelector('input[name="ans"][value="'+answers[s.name]+'"]');
    if(sel) sel.checked=true;
  }
}
function testNext(){
  var checked=document.querySelector('input[name="ans"]:checked');
  if(!checked){ alert('Selecciona una respuesta'); return; }
  var s=steps[idx]; answers[s.name]=checked.value;
  if(idx<steps.length-1){ idx++; render(); }
  else { calcularResultado(); }
}
function testBack(){ if(idx>0){ idx--; render(); } }
function calcularResultado(){
  var puntos=0;
  for(var i=0;i<steps.length;i++){
    var s=steps[i]; var v=answers[s.name]||'no';
    var positivo = s.invert ? (v==='no') : (v==='si');
    if(positivo) puntos++;
  }
  var nivel='', msg='';
  if(puntos>=5){nivel='Muy bien'; msg='Tu rutina va por buen camino. Mantén hábitos y revisa cada 6–12 meses.';}
  else if(puntos>=3){nivel='Mejorable'; msg='Refuerza hilo/irrigador, limpieza de lengua y recambios; reduce azúcares.';}
  else{nivel='Necesita cambios'; msg='Te vendrá bien un repaso de hábitos y quizá una limpieza profesional.';}
  var html='<h2 style="margin:0">Resultado: '+nivel+'</h2><p>'+msg+'</p>' +
           '<p><a class="btn" href="conoceme.html">Recibir consejos por email</a> ' +
           '<a class="btn secondary" href="clinica.html">Pedir cita en clínica</a> ' +
           '<a class="btn-accent" target="_blank" rel="noopener" href="https://wa.me/34669033565">Escribir por WhatsApp</a></p>';
  var box=document.getElementById('resultado'); box.innerHTML=html; box.style.display='block'; box.scrollIntoView({behavior:'smooth'});
  document.getElementById('step-box').style.display='none';
  document.getElementById('nav-box').style.display='none';
}
window.addEventListener('load', render);
</script>
<script>
function calcularTest(e){e.preventDefault();
  var total=6, puntos=0;
  for(var i=1;i<=total;i++){var el=document.querySelector('input[name="q'+i+'"]:checked'); if(el && el.value==='si') puntos++;}
  var nivel='', msg='';
  if(puntos>=5){nivel='Muy bien'; msg='Tu rutina va por buen camino. Mantén hábitos y revisa cada 6-12 meses.';}
  else if(puntos>=3){nivel='Mejorable'; msg='Hay puntos a reforzar: hilo/irrigador, lengua, recambios y reducir azúcar.';}
  else{nivel='Necesita cambios'; msg='Te vendrá bien un repaso completo de hábitos y quizá una limpieza profesional.';}
  var html='<h2 style="margin:0">Resultado: '+nivel+'</h2><p>'+msg+'</p>' +
           '<p><a class="btn" href="conoceme.html">Recibir consejos por email</a> ' +
           '<a class="btn secondary" href="clinica.html">Pedir cita en clínica</a> ' +
           '<a class="btn secondary" target="_blank" rel="noopener" href="https://wa.me/34669033565">Escribir por WhatsApp</a></p>';
  var box=document.getElementById('resultado'); box.innerHTML=html; box.style.display='block'; box.scrollIntoView({behavior:'smooth'});
  return false;
}
</script>
